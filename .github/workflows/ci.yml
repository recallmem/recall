name: CI

# Lint, typecheck and every test suite on each push to main and each pull request.
# Vercel deploys main on its own; this is the check that tells you whether that push was sound.
# Changes to Markdown and docs/ alone run nothing. The Python integrations have their own
# workflow (python-integrations.yml), run when Python code or the guides change.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

# A newer push cancels the older run, on main too: pnpm check runs locally before every push to
# main, so only the latest commit needs CI's word (Actions minutes are limited).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e "sdks/python[dev]"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Server, TypeScript SDK and eval harness (offline: in-memory database, mock model).
      # The server suite also runs the Hermes provider's Python tests against a real server.
      - name: Test
        run: pnpm test

      - name: Python SDK
        run: python -m pytest sdks/python/tests -q
