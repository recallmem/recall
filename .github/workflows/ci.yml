name: CI

# Lint, typecheck and every test suite on each push to main and each pull request.
# Vercel deploys main on its own; this is the check that tells you whether that push was sound.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push cancels an older run only on pull requests; every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e "sdks/python[dev]"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Server, TypeScript SDK and eval harness (offline: in-memory database, mock model).
      # The server suite also runs the Hermes provider's Python tests against a real server.
      - name: Test
        run: pnpm test

      - name: Python SDK
        run: python -m pytest sdks/python/tests -q
