# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every pull request to this repository. The instructions below point it at
# what matters here: the promises the README, docs and site make, and the code that has to keep them.
language: en-US
tone_instructions: >-
  Plain, direct English. Report bugs with a concrete failing input or sequence of events; skip
  style preferences the linter (Biome) already settles.
reviews:
  profile: chill
  poem: false
  high_level_summary: true
  collapse_walkthrough: true
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # Generated by packages/server/scripts/site (review the generators and templates instead).
    - "!packages/server/public/home.html"
    - "!packages/server/public/calculator.html"
    - "!packages/server/public/compare.html"
    - "!packages/server/public/compare/**"
    - "!packages/server/public/guides.html"
    - "!packages/server/public/guides/**"
    - "!packages/server/public/*-memory.html"
    - "!packages/server/public/llms.txt"
    - "!packages/server/public/sitemap.xml"
    - "!packages/server/src/http/dashboard/night.ts"
    # Lockfiles, fonts and images.
    - "!**/pnpm-lock.yaml"
    - "!**/*.woff2"
    - "!**/*.png"
    - "!**/*.svg"
  path_instructions:
    - path: "integrations/{claude-code,codex}/scripts/**"
      instructions: |
        Hooks of the Claude Code and Codex plugins (they share lib.mjs). The README promises:
        every prompt and reply is written to disk (one spool file each) before anything is sent,
        and the file is removed only after Recall has taken the message; a message Recall rejects
        for good is counted and reported, never dropped silently; messages are sent oldest first
        within a time budget so a hook finishes well inside the host's hook timeout; hooks never
        block or fail the agent. Check each change against these, with hooks running at the same
        time as separate processes, a hook killed (SIGKILL) at any line, and a server that is slow,
        unreachable, or answers 401/402/403/409/422/429/500. Flag any path that removes a spool
        file without Recall having taken the message or counting it as lost, and any write that
        another hook could overwrite with an older copy.
    - path: "packages/server/src/reasoner/**"
      instructions: |
        Turns conversations into facts. Every stored fact must cite at least one message its
        subject wrote in the window; a fact citing nothing valid is dropped, never attributed to
        some other message as a fallback. Model output is untrusted input: check that validation
        is deterministic and that a malformed or adversarial answer cannot create, change or
        delete facts it should not.
    - path: "packages/server/src/**"
      instructions: |
        Multi-tenant API. Every route goes through guard(ctx, policy); flag any query that is not
        scoped to the caller's account and workspace. Every model call goes through ctx.llm with a
        task and workspaceId so it is metered and billed. Background work is enqueued in the same
        transaction as the data it depends on. Errors are ApiError, returned as {"detail": "..."}.
    - path: "packages/server/src/db/migrations/**"
      instructions: |
        Migrations run against a live Postgres with data. Flag anything that locks a large table
        for long, drops data, or does not match packages/server/src/db/schema.ts.
    - path: "**/*.md"
      instructions: |
        Public text. Flag any promise the code does not keep (durability, ordering, deletion,
        sources, pricing, limits). The server is source-available under FSL-1.1-ALv2 and the SDKs
        and integrations are MIT: flag any wording that calls the server open source.
chat:
  auto_reply: true
